services:
  app:
    build: .
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8083}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/create-testing-db.sql:/docker-entrypoint-initdb.d/create-testing-db.sql:ro
    ports:
        - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking", "-d", "booking"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres:
